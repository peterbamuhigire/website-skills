name: Skill engine quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML pytest
      - run: python -X utf8 scripts/validate-skill-contracts.py --baseline quality/skill-contract-baseline.json
      - run: python -X utf8 scripts/routing-smoke-test.py
      - run: python -m pytest -q
