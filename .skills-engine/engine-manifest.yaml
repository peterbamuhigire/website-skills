schema_version: "1.0"
engine_id: website-skills
display_name: Website Skills
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: registry
    command: >-
      python scripts/validate-skill-registry.py
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: skill-contracts
    command: >-
      python scripts/validate-skill-contracts.py --baseline quality/skill-contract-baseline.json
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: routing
    command: >-
      python scripts/routing-smoke-test.py
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: search-doctrine-currentness
    command: >-
      python scripts/validate-search-doctrine.py
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: source-ingestion
    command: >-
      python scripts/source_ingestion_guardrail.py --root .
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: tests
    command: >-
      python -m pytest -q
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
claude_only_block: |
  - Apply `AGENTS.md` in full, including its runner-agnostic doctrine; skip only its explicitly
    Codex-only sections (e.g. "Codex-only model setup").
  - **Optional plugins (engine gates remain authoritative):** these Claude Code plugins can help
    with website development work:

    ```text
    /plugin marketplace add obra/superpowers-marketplace
    /plugin install superpowers@superpowers-marketplace
    /plugin marketplace add anthropics/claude-code
    /plugin install frontend-design@claude-code-plugins
    ```

    Use a plugin only where it materially improves design, implementation, debugging, or QA
    output. A plugin never replaces or overrides an engine gate, stage gate or verification step.
invariants:
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries and raw book text must never be stored in this"
  - id: not-assessed
    phrase: "Missing browser, render, live, or stakeholder evidence is `NOT ASSESSED`, never a pass."
  - id: premium-default
    phrase: "Premium is the default commercial standard for this website engine."
invariant_exemptions:
  british-english: "No British English output rule exists in the website router (AGENTS.md, former CLAUDE.md); language rules route through language-standards and regional skills. Adding one is new doctrine outside M10-02-T02 scope."
plugin_exclusions:
  - path: "templates/skill"
    reason: "authoring template copied when a new skill is created; not an active skill"
