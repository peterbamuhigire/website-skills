<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a site visit — native controls fixture</title>
  <meta name="description" content="Fictional contact page for the native-control minimalism fixture.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <header>
    <a href="index.html">Native controls fixture</a>
    <nav aria-label="Primary">
      <a href="index.html">Book a visit</a>
    </nav>
  </header>
  <main>
    <h1>Book a site visit</h1>
    <p>This fictional contact page is a fixture. It is not a client page.</p>
    <form action="index.html" method="get">
      <label for="visit-date">Preferred visit date</label>
      <input id="visit-date" name="visit-date" type="text" required>
      <label for="brand-colour">Brand colour to match</label>
      <input id="brand-colour" name="brand-colour" type="color" value="#0b5d4b">
      <label for="phone">WhatsApp number</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" required>
      <button type="submit">Request the visit</button>
    </form>
  </main>
  <footer><a href="index.html">Home</a></footer>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>flatpickr("#visit-date");</script>
</body>
</html>
